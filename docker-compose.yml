version: '3.8'

services:
  db:
    image: postgres:16
    container_name: logistics_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: logistics_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Додаємо скрипт для ініціалізації БД при першому запуску
      # - ./scripts/init_rls.sql:/docker-entrypoint-initdb.d/init_rls.sql

volumes:
  postgres_data:
