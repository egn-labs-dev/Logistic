version: '3.8'
services:
  vault:
    image: hashicorp/vault:latest
    cap_add: [IPC_LOCK]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "root"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"

  vault-agent:
    image: hashicorp/vault:latest
    command: agent -config=/config/vault-agent.hcl
    volumes:
      - ./config:/config
      - shared-secrets:/vault/secrets
    depends_on:
      - vault

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: log_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: logistics_secure_db
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    restart: always
    depends_on:
      - db
      - vault-agent
      - jaeger
    volumes:
      - shared-secrets:/vault/secrets:ro
    env_file:
      - .env
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
    command: >
      sh -c "alembic upgrade head && gunicorn app.main:app --workers 4 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000"

  frontend:
    build: ./frontend
    restart: always
    ports:
      - "80:80"

  jaeger:
    image: jaegertracing/all-in-one:latest
    restart: always
    ports:
      - "16686:16686"
      - "4317:4317"

volumes:
  pgdata:
  shared-secrets:
    driver_opts:
      type: tmpfs
      device: tmpfs
