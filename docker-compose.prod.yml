services:
  vault:
    image: hashicorp/vault:latest
    cap_add: [IPC_LOCK]
    command: server -config=/vault/config/vault.hcl
    volumes:
      - ./config/vault.hcl:/vault/config/vault.hcl
      - vault-data:/vault/file
    environment:
      VAULT_ADDR: "http://0.0.0.0:8200"
      VAULT_API_ADDR: "http://0.0.0.0:8200"
    networks:
      - logistic-net

  vault-agent:
    image: hashicorp/vault:latest
    command: agent -config=/config/vault-agent.hcl
    volumes:
      - ./config:/config
      - shared-secrets:/vault/secrets
    depends_on:
      - vault
    networks:
      - logistic-net

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: log_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: logistics_secure_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U log_admin -d logistics_secure_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - logistic-net

  api:
    build: .
    restart: always
    depends_on:
      db:
        condition: service_healthy
      vault-agent:
        condition: service_started
      jaeger:
        condition: service_started
    volumes:
      - shared-secrets:/vault/secrets:ro
    env_file:
      - .env
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
    command: >
      sh -c "alembic upgrade head && gunicorn app.main:app --workers 4 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - logistic-net

  frontend:
    build: ./frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - logistic-net

  jaeger:
    image: jaegertracing/all-in-one:latest
    restart: always
    ports:
      - "16686:16686"
    networks:
      - logistic-net

networks:
  logistic-net:
    driver: bridge

volumes:
  pgdata:
  vault-data:
  shared-secrets:
    driver_opts:
      type: tmpfs
      device: tmpfs
